name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify production routes and auth boundaries
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run test:smoke
        env:
          PREZZSTORE_EXPECTED_COMMIT: ${{ github.sha }}
